<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      const currentPath =
        window.location.pathname + window.location.search + window.location.hash;
      const basePath = window.location.pathname.includes('/brotherhood/')
        ? '/brotherhood/'
        : '/';
      const target = `${basePath}?p=${encodeURIComponent(currentPath)}`;
      window.location.replace(target);
    </script>
  </body>
</html>
