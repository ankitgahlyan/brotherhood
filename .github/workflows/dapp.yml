name: dApp

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: latest

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Formatter
        run: nub run fmt:check

      - name: Typecheck
        run: nub run typecheck

      - name: Build
        env:
          VITE_BASE: /brotherhood/
        run: nub run build

      - name: Test
        run: nub run test
