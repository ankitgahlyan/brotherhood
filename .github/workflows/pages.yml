# GitHub Pages — Build & Deploy (Web + TWA)
# Builds both targets in parallel, assembles them side-by-side, and publishes:
#   /brotherhood/       → Web PWA
#   /brotherhood/twa/  → Telegram Mini App (TWA)
name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued ones (don't cancel in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build packages (shared across both app targets)
  # ─────────────────────────────────────────────────────────────────────────────
  build-packages:
    name: Build shared packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Formatter
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build packages
        run: bun run build:packages

      - name: Cache packages build
        uses: actions/cache/save@v4
        with:
          path: |
            packages/walletkit/dist
            packages/v4ledger-adapter/dist
            packages/wallet-core/dist
          key: packages-${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Web PWA
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web PWA
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore packages build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/walletkit/dist
            packages/v4ledger-adapter/dist
            packages/wallet-core/dist
          key: packages-${{ github.sha }}

      - name: Build Web
        env:
          VITE_BASE: /brotherhood/
          VITE_APP_TARGET: web
        run: bun run --cwd apps/wallet build:web && node scripts/copy-to-dist.mjs --target=web

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/wallet/dist
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Telegram Mini App (TWA)
  # ─────────────────────────────────────────────────────────────────────────────
  build-twa:
    name: Build TWA (Telegram Mini App)
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore packages build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/walletkit/dist
            packages/v4ledger-adapter/dist
            packages/wallet-core/dist
          key: packages-${{ github.sha }}

      - name: Build TWA
        env:
          VITE_BASE: /brotherhood/twa/
          IS_TELEGRAM_APP: '1'
        run: bun run --cwd apps/wallet build:twa && node scripts/copy-to-dist.mjs --target=twa

      - name: Upload TWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: twa-dist
          path: apps/wallet/dist-twa
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Run unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  # ─────────────────────────────────────────────────────────────────────────────
  # Assemble dual-target GitHub Pages artifact and deploy
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Assemble & Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-web, build-twa, test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/wallet/dist

      - name: Download TWA artifact
        uses: actions/download-artifact@v4
        with:
          name: twa-dist
          path: apps/wallet/dist-twa

      - name: Assemble dual-target dist/client (with 404.html at each level)
        run: node scripts/gh-pages-404.mjs

      - name: Verify artifact structure
        run: |
          echo "🔍 Verifying dist/client layout..."
          test -f dist/client/index.html && echo "✅ Web index.html" || (echo "❌ Missing Web index.html" && exit 1)
          test -f dist/client/404.html && echo "✅ Web 404.html" || (echo "❌ Missing Web 404.html" && exit 1)
          test -f dist/client/twa/index.html && echo "✅ TWA index.html" || (echo "❌ Missing TWA index.html" && exit 1)
          test -f dist/client/twa/404.html && echo "✅ TWA 404.html" || (echo "❌ Missing TWA 404.html" && exit 1)
          test -f dist/client/twa/_headers && echo "✅ TWA _headers" || (echo "❌ Missing TWA _headers" && exit 1)
          grep -q "noindex" dist/client/twa/_headers && echo "✅ TWA _headers contains noindex" || (echo "❌ TWA _headers missing noindex" && exit 1)
          echo "✅ All verification checks passed"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
