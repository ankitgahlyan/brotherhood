<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bannerGlow" cx="25%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#142850" stop-opacity="1"/>
      <stop offset="50%" stop-color="#091322" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bannerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bannerCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="bannerNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bannerGlow)"/>

  <!-- Grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Cyber Globe Graphics on Right -->
  <g transform="translate(880, 200)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#bannerCyan)" stroke-width="2" stroke-opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="120" fill="none" stroke="url(#bannerCyan)" stroke-width="1.5" stroke-opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="120" ry="50" fill="none" stroke="url(#bannerCyan)" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="url(#bannerCyan)" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="url(#bannerCyan)" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Shield Logo inside globe -->
    <polygon points="0,-50 45,-25 45,35 0,65 -45,35 -45,-25" fill="#0F172A" stroke="url(#bannerGold)" stroke-width="3" filter="url(#bannerNeon)"/>
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#bannerGold)" text-anchor="middle">.bro</text>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="url(#bannerCyan)" letter-spacing="3">DECENTRALIZED IDENTITY ON TON</text>
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Brotherhood <tspan fill="url(#bannerGold)">.bro</tspan> DNS</text>
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">Instant minting, TEP-81 resolution &amp; sovereign namespace</text>
  </g>
</svg>
