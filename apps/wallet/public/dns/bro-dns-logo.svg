<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142850" stop-opacity="1"/>
      <stop offset="60%" stop-color="#091322" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Globe Latitudes / Longitudes -->
  <ellipse cx="256" cy="256" rx="140" ry="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
  <ellipse cx="256" cy="256" rx="70" ry="140" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="256" y1="116" x2="256" y2="396" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Central Shield / Badge Core -->
  <polygon points="256,150 330,190 330,285 256,335 182,285 182,190" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- TON Diamond Accent at Top -->
  <path d="M 256,170 L 274,198 L 256,220 L 238,198 Z" fill="url(#cyanGrad)" opacity="0.9"/>

  <!-- .bro Typography -->
  <text x="256" y="278" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">.bro</text>

  <!-- Subtitle -->
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">BROTHERHOOD DNS</text>
  <circle cx="256" cy="445" r="3" fill="url(#goldGrad)"/>
</svg>
