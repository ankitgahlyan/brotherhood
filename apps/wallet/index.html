<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" id="app-manifest" href="/site.webmanifest" />
    <meta
      name="mobile-web-app-capable"
      content="yes"
      id="meta-mobile-web-app-capable"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
      id="meta-apple-mobile-web-app-capable"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="BrotherHood" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>BrotherHood Wallet</title>
    <script src="/buffer-polyfill.js"></script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('brotherhood-theme');
          var isDark =
            stored === 'dark' ||
            stored === 'oled' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = stored === 'oled' ? 'oled' : isDark ? 'dark' : 'light';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', isDark ? 'dark' : 'light');

          var palette = localStorage.getItem('brotherhood-palette') || 'violet';
          document.documentElement.setAttribute('data-palette', palette);
        } catch (e) {}
      })();
    </script>
    <!-- GitHub Pages SPA deep-link restore.
         When 404.html redirects here it appends ?p=<encoded-path>&q=<encoded-search>.
         Restore the intended URL before the router boots so TanStack Router
         sees the correct path. -->
    <script>
      (function () {
        var sp = new URLSearchParams(window.location.search);
        var p = sp.get('p');
        if (p) {
          var q = sp.get('q') || '';
          sp.delete('p');
          sp.delete('q');
          var rest = sp.toString();
          var search = q + (rest ? (q ? '&' : '?') + rest : '');
          window.history.replaceState(
            null,
            '',
            p + search + (window.location.hash || ''),
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
