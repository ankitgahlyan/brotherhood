# Netlify Configuration for BrotherHood Wallet
[build]
  command = "bun run build:netlify"
  publish = "apps/wallet/dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
